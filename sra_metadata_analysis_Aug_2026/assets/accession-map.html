<div class="amap">
<svg viewBox="0 0 1180 425" width="1180" height="425" role="img"
     aria-label="How sequence archive identifiers connect: BioProject to Study to Experiment to Run, with BioSample and Sample on the right.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A855F7"/>
    </marker>
  </defs>

  <!-- GEO -->
  <g>
    <rect x="20" y="30" width="210" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="20" y="30" width="5" height="58" rx="2.5" fill="#64748B"/>
    <text class="t" x="38" y="53">GEO series</text>
    <text class="c" x="38" y="74">GSE · GSM</text>
    <text class="n" x="38" y="103">NCBI only. Most papers</text>
    <text class="n" x="38" y="119">cite only this number.</text>
  </g>
  <line x1="230" y1="59" x2="292" y2="59" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- main chain -->
  <g>
    <rect x="300" y="30" width="280" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="300" y="30" width="5" height="58" rx="2.5" fill="#0EA5E9"/>
    <text class="t" x="318" y="53">BioProject</text>
    <text class="c" x="318" y="74">PRJNA · PRJEB · PRJDB</text>
  </g>
  <line x1="440" y1="88" x2="440" y2="122" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="l" x="452" y="112">normally 1 : 1</text>

  <g>
    <rect x="300" y="130" width="280" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="300" y="130" width="5" height="58" rx="2.5" fill="#6366F1"/>
    <text class="t" x="318" y="153">Study</text>
    <text class="c" x="318" y="174">SRP · ERP · DRP</text>
  </g>
  <line x1="440" y1="188" x2="440" y2="237" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="l" x="452" y="218">1 : many</text>

  <g>
    <rect x="300" y="245" width="280" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="300" y="245" width="5" height="58" rx="2.5" fill="#F59E0B"/>
    <text class="t" x="318" y="268">Experiment</text>
    <text class="c" x="318" y="289">SRX · ERX · DRX</text>
  </g>
  <line x1="440" y1="303" x2="440" y2="352" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="l" x="452" y="333">1 : many</text>

  <g>
    <rect x="300" y="360" width="280" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="300" y="360" width="5" height="58" rx="2.5" fill="#10B981"/>
    <text class="t" x="318" y="383">Run</text>
    <text class="c" x="318" y="404">SRR · ERR · DRR</text>
  </g>
  <text class="n" x="600" y="384">One run holds the data files.</text>
  <text class="n" x="600" y="404">A paper can give a number of any level.</text>

  <!-- sample side -->
  <g>
    <rect x="760" y="130" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="760" y="130" width="5" height="58" rx="2.5" fill="#A855F7"/>
    <text class="t" x="778" y="153">BioSample</text>
    <text class="c" x="778" y="174">SAMN · SAMEA · SAMD</text>
  </g>
  <line x1="910" y1="188" x2="910" y2="237" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="l" x="922" y="218">1 : 1</text>

  <g>
    <rect x="760" y="245" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="760" y="245" width="5" height="58" rx="2.5" fill="#A855F7"/>
    <text class="t" x="778" y="268">Sample</text>
    <text class="c" x="778" y="289">SRS · ERS · DRS</text>
  </g>
  <line x1="752" y1="274" x2="590" y2="274" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="l" x="608" y="264">what was sequenced</text>

  <!-- reuse path: one sample, several projects -->
  <path d="M 752 159 L 620 159 L 620 59 L 592 59"
        fill="none" stroke="#A855F7" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
  <text class="p" x="636" y="96">one sample can belong to more than one project — one belongs to 54</text>

  <style>
    .amap { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
    .amap text.t { font-size: 16px; font-weight: 700; fill: #0F2540; }
    .amap text.c { font-size: 14px; font-family: "SF Mono", Menlo, Consolas, monospace; fill: #475569; }
    .amap text.l { font-size: 12.5px; fill: #64748B; }
    .amap text.n { font-size: 13px; fill: #94A3B8; }
    .amap text.p { font-size: 12.5px; fill: #A855F7; }
  </style>
</svg>
</div>
